services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cartive}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - cartive-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: mini -dir=/data -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cartive-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-cartive-local-secret}
      S3_BUCKET: ${S3_BUCKET:-cartive-private}
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - cartive-object-storage:/data

volumes:
  cartive-mysql:
  cartive-object-storage:
